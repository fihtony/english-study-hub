<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="English Study Hub - Learn English effectively">
    <meta name="theme-color" content="#1f2937">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>{% block title %}English Study Hub{% endblock %}</title>
</head>
<body>
    <header class="header">
        <nav class="navbar" role="navigation" aria-label="Main navigation">
            <div class="navbar-container">
                <div class="navbar-brand">
                    <a href="/" class="logo" aria-label="English Study Hub home">
                        <span class="logo-text">English Study Hub</span>
                    </a>
                </div>
                <button class="navbar-toggle" id="navbar-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
                    <span class="hamburger"></span>
                </button>
                <ul class="nav-menu" id="nav-menu" role="menubar">
                    <li role="none"><a href="/" class="nav-link" role="menuitem">Home</a></li>
                    <li role="none"><a href="#features" class="nav-link" role="menuitem">Features</a></li>
                    <li role="none"><a href="#about" class="nav-link" role="menuitem">About</a></li>
                    <li role="none"><a href="#contact" class="nav-link" role="menuitem">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main id="main-content" role="main">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer" role="contentinfo">
        <div class="footer-container">
            <div class="footer-content">
                <p class="footer-text">&copy; 2026 English Study Hub. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
