name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: Run pytest (Python 3.12)
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.local/share/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install --no-cache-dir -r requirements.txt
          else
            echo "No requirements.txt found; skipping install."
          fi

      - name: Show Python & installed packages
        run: |
          python --version
          pip --version
          pip freeze || true

      - name: Run pytest and capture output
        id: run_tests
        env:
          PYTHONUNBUFFERED: 1
        run: |
          mkdir -p test-results
          # Ensure failures propagate while still capturing output
          set -o pipefail
          pytest --maxfail=1 -q --junitxml=test-results/junit.xml 2>&1 | tee test-results/pytest-output.txt

      - name: Upload pytest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results
          retention-days: 7

      - name: Upload full workspace snapshot (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-snapshot
          path: |
            .
          # Keep small retention for workspace snapshot to avoid long-term storage
          retention-days: 3