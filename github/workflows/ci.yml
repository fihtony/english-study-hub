name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    name: Run tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache pip (fallback)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install --requirement requirements.txt
          else
            echo "requirements.txt not found; skipping install step"
          fi
        env:
          PYTHONUNBUFFERED: '1'

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Run pytest with coverage (fail-fast)
        # --maxfail=1 causes pytest to stop on first failure; -q reduces noise
        run: |
          set -o pipefail
          pytest --maxfail=1 -q \
            --junitxml=reports/pytest-results.xml \
            --cov=./ \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing
        env:
          PYTHONUNBUFFERED: '1'

      - name: Show brief coverage file head (if generated)
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            echo "=== coverage.xml (first 200 lines) ==="
            head -n 200 coverage.xml || true
          else
            echo "No coverage.xml found"
          fi

      - name: Upload pytest results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/pytest-results.xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload full repository snapshot (optional, small)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-snapshot
          path: |
            .
          retention-days: 1

    # Fail fast behavior: job will stop on failing steps (tests step stops on first test failure
    # due to pytest --maxfail=1). Artifacts are uploaded regardless using `if: always()` above.